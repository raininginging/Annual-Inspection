<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HNB Annual Inspection Form</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- docx.js Library for Pure JS Word Generation -->
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
    <style>
        input, select, textarea { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24">

    <!-- Header -->
    <header class="bg-blue-700 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">HNB Annual Inspection Report</h1>
            <span class="text-xs bg-blue-800 px-2 py-1 rounded">Mobile Form</span>
        </div>
    </header>

    <!-- Main Form -->
    <main class="max-w-3xl mx-auto p-4 space-y-6">
        <form id="inspectionForm" class="space-y-6">
            
            <!-- 1. Inspector -->
            <div class="bg-white rounded-xl shadow-sm p-4 border space-y-3">
                <h2 class="text-md font-bold text-blue-700 border-b pb-2">1. Inspector Information</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Last Name</label>
                        <input type="text" id="inspector_last" value="ZHANG" class="w-full border rounded p-2 bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">First Name</label>
                        <input type="text" id="inspector_first" value="Rui" class="w-full border rounded p-2 bg-slate-50">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Date of Inspection</label>
                    <input type="date" id="inspection_date" class="w-full border rounded p-2">
                </div>
            </div>

            <!-- 2. Tenant -->
            <div class="bg-white rounded-xl shadow-sm p-4 border space-y-3">
                <h2 class="text-md font-bold text-blue-700 border-b pb-2">2. Tenant Information</h2>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="tenant_last" placeholder="Tenant Last Name" class="border rounded p-2">
                    <input type="text" id="tenant_first" placeholder="First & Middle Names" class="border rounded p-2">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="tenant_phone_day" placeholder="Daytime Phone #" class="border rounded p-2">
                    <input type="text" id="tenant_phone_other" placeholder="Other Phone #" class="border rounded p-2">
                </div>
                <input type="email" id="tenant_email" placeholder="Email" class="w-full border rounded p-2">
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="num_adults" placeholder="# of Adults" class="border rounded p-2">
                    <input type="number" id="num_kids" placeholder="# of Kids" class="border rounded p-2">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="num_pets" placeholder="# of Pets" class="border rounded p-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Update Septic Services?</label>
                        <select id="update_septic" class="w-full border rounded p-2 bg-white">
                            <option value="NO">NO</option>
                            <option value="YES">YES</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 3. Details -->
            <div class="bg-white rounded-xl shadow-sm p-4 border space-y-3">
                <h2 class="text-md font-bold text-blue-700 border-b pb-2">3. Unit & Building Details</h2>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="project_no" placeholder="Project No." class="border rounded p-2">
                    <input type="text" id="apt_site" placeholder="Apt. / Site #" class="border rounded p-2">
                </div>
                <input type="text" id="street_name" placeholder="Street # and Name" class="w-full border rounded p-2">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="municipality" placeholder="Municipality" class="border rounded p-2">
                    <input type="text" id="nb_power_meter" placeholder="NB Power Meter #" class="border rounded p-2">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Type of House</label>
                        <select id="house_type" class="w-full border rounded p-2 bg-white">
                            <option value="Mini-home">Mini-home</option>
                            <option value="Bungalow">Bungalow</option>
                            <option value="Single Unit">Single Unit</option>
                            <option value="Duplex">Duplex</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Basement Exist?</label>
                        <select id="basement_exist" class="w-full border rounded p-2 bg-white">
                            <option value="NO">NO</option>
                            <option value="YES">YES</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 4. Checklist -->
            <div class="bg-white rounded-xl shadow-sm p-4 border space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <h2 class="text-md font-bold text-blue-700">4. Inspection Checklist</h2>
                    <button type="button" onclick="setAllGood()" class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded font-bold border border-emerald-300">Set All Good</button>
                </div>
                <div id="dynamic-checklist" class="space-y-3 pt-2"></div>
            </div>

            <!-- 5. Appliances -->
            <div class="bg-white rounded-xl shadow-sm p-4 border space-y-3">
                <h2 class="text-md font-bold text-blue-700 border-b pb-2">5. Appliances Details</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-2 border p-2.5 rounded bg-slate-50">
                        <span class="text-xs font-bold text-slate-700 block border-b pb-1">Oven</span>
                        <input type="text" id="oven_serial" placeholder="Serial #" class="w-full border rounded p-1.5 text-xs">
                        <input type="text" id="oven_model" placeholder="Model #" class="w-full border rounded p-1.5 text-xs">
                        <input type="text" id="oven_make" placeholder="Make #" class="w-full border rounded p-1.5 text-xs">
                    </div>
                    <div class="space-y-2 border p-2.5 rounded bg-slate-50">
                        <span class="text-xs font-bold text-slate-700 block border-b pb-1">Fridge</span>
                        <input type="text" id="fridge_serial" placeholder="Serial #" class="w-full border rounded p-1.5 text-xs">
                        <input type="text" id="fridge_model" placeholder="Model #" class="w-full border rounded p-1.5 text-xs">
                        <input type="text" id="fridge_make" placeholder="Make #" class="w-full border rounded p-1.5 text-xs">
                    </div>
                </div>
            </div>

            <!-- 6. Sign Off -->
            <div class="bg-white rounded-xl shadow-sm p-4 border space-y-3">
                <h2 class="text-md font-bold text-blue-700 border-b pb-2">6. Final Notes & Sign Off</h2>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Notify Program Officer ASAP?</label>
                    <select id="notify_officer" class="w-full border rounded p-2 bg-white">
                        <option value="NO">NO</option>
                        <option value="YES">YES</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Miscellaneous / Comments</label>
                    <textarea id="miscellaneous" rows="3" placeholder="Additional notes..." class="w-full border rounded p-2"></textarea>
                </div>
            </div>
        </form>
    </main>

    <!-- Floating Share Button -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 shadow-lg flex gap-3 max-w-3xl mx-auto">
        <button type="button" id="shareBtn" onclick="generateAndShareDocx()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-blue-700 active:scale-95 transition flex justify-center items-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
            <span id="btnText">Generate & Share Word (.docx)</span>
        </button>
    </div>

    <script>
        document.getElementById('inspection_date').valueAsDate = new Date();

        const checklistItems = [
            "Roof", "Siding", "Eaves through", "Windows", "Foundation", 
            "Surface Grading & Drainage", "Portable Well", "Well Cap", "Doors", "Decks/landings/ramps",
            "Stairs", "Handrail Downstairs", "Handrail Upstairs", "House Keeping", "Flooring", "Cabinets",
            "Water Pump", "Water Treatment", "Shower Walls", "Hot Water Tank",
            "Heating System", "Elect Panel", "GFCI Outlets", "Lighting", "Fire Alarm System", "Smoke Detector",
            "HRV", "Outside Vents", "Filters", "Exhaust Fan", "Range Hood"
        ];

        const checklistContainer = document.getElementById('dynamic-checklist');
        checklistItems.forEach((item, index) => {
            const key = `item_${index}`;
            const html = `
                <div class="p-3 bg-slate-50 rounded border space-y-2">
                    <span class="font-bold text-sm text-slate-700">${item}</span>
                    <div class="grid grid-cols-4 gap-1.5">
                        <label class="text-center p-2 rounded bg-white border text-xs cursor-pointer"><input type="radio" name="${key}_status" value="Good" onchange="handleStatusChange(${index}, 'Good')" checked> Good</label>
                        <label class="text-center p-2 rounded bg-white border text-xs cursor-pointer"><input type="radio" name="${key}_status" value="Fair" onchange="handleStatusChange(${index}, 'Fair')"> Fair</label>
                        <label class="text-center p-2 rounded bg-white border text-xs cursor-pointer"><input type="radio" name="${key}_status" value="Replace/Repair" onchange="handleStatusChange(${index}, 'Replace/Repair')"> Repair</label>
                        <label class="text-center p-2 rounded bg-white border text-xs cursor-pointer text-amber-700 font-medium"><input type="radio" name="${key}_status" value="Not Inspected" onchange="handleStatusChange(${index}, 'Not Inspected')"> Not Inspected</label>
                    </div>
                    <input type="text" id="${key}_comment" placeholder="Comments" class="w-full border rounded p-1.5 text-xs bg-white">
                </div>
            `;
            checklistContainer.insertAdjacentHTML('beforeend', html);
        });

        function handleStatusChange(index, status) {
            const commentInput = document.getElementById(`item_${index}_comment`);
            if (status === 'Not Inspected') {
                commentInput.value = 'N/A';
            } else if (commentInput.value.trim().toUpperCase() === 'N/A') {
                commentInput.value = '';
            }
        }

        function setAllGood() {
            checklistItems.forEach((_, index) => {
                const radios = document.getElementsByName(`item_${index}_status`);
                if(radios.length) {
                    radios[0].checked = true;
                    handleStatusChange(index, 'Good');
                }
            });
        }

        // Generate Pure Word (.docx) document strictly matching original layout
        async function generateAndShareDocx() {
            const btnText = document.getElementById('btnText');
            btnText.innerText = "Generating Word File...";

            try {
                const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType, BorderStyle } = window.docx;

                // Value helpers
                const val = (id) => document.getElementById(id)?.value || '';

                // Table border styles matching HNB form
                const thinBorder = { style: BorderStyle.SINGLE, size: 4, color: "000000" };
                const borders = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };

                const createCell = (text, widthPct, bold = false, align = AlignmentType.LEFT) => new TableCell({
                    children: [new Paragraph({
                        alignment: align,
                        children: [new TextRun({ text: text, bold: bold, size: 18, font: "Calibri" })]
                    })],
                    width: { size: widthPct, type: WidthType.PERCENTAGE },
                    borders: borders
                });

                // Build Table Rows
                const rows = [
                    // Header
                    new TableRow({
                        children: [new TableCell({
                            children: [new Paragraph({
                                alignment: AlignmentType.CENTER,
                                children: [new TextRun({ text: "ANNUAL INSPECTION FORM - HNB", bold: true, size: 24, font: "Calibri" })]
                            })],
                            columnSpan: 8,
                            borders: borders
                        })]
                    }),
                    // Inspector
                    new TableRow({
                        children: [
                            createCell("Inspector:", 15, true),
                            createCell(`${val('inspector_first')} ${val('inspector_last')}`, 35),
                            createCell("Date:", 15, true),
                            createCell(val('inspection_date'), 35)
                        ].map(c => { c.columnSpan = c.width.size === 35 ? 3 : 1; return c; })
                    }),
                    // Tenant & Project
                    new TableRow({
                        children: [
                            createCell("Tenant Name:", 15, true),
                            createCell(`${val('tenant_first')} ${val('tenant_last')}`, 35),
                            createCell("Project No:", 15, true),
                            createCell(val('project_no'), 35)
                        ].map(c => { c.columnSpan = c.width.size === 35 ? 3 : 1; return c; })
                    }),
                    new TableRow({
                        children: [
                            createCell("Day Phone:", 15, true),
                            createCell(val('tenant_phone_day'), 35),
                            createCell("Apt / Site #:", 15, true),
                            createCell(val('apt_site'), 35)
                        ].map(c => { c.columnSpan = c.width.size === 35 ? 3 : 1; return c; })
                    }),
                    new TableRow({
                        children: [
                            createCell("Street & Name:", 15, true),
                            createCell(val('street_name'), 35),
                            createCell("Municipality:", 15, true),
                            createCell(val('municipality'), 35)
                        ].map(c => { c.columnSpan = c.width.size === 35 ? 3 : 1; return c; })
                    }),
                    new TableRow({
                        children: [
                            createCell("Type of House:", 15, true),
                            createCell(val('house_type'), 35),
                            createCell("Basement:", 15, true),
                            createCell(val('basement_exist'), 35)
                        ].map(c => { c.columnSpan = c.width.size === 35 ? 3 : 1; return c; })
                    }),
                    // Table Header for Checklist
                    new TableRow({
                        children: [
                            createCell("ITEM", 18, true), createCell("G", 4, true, AlignmentType.CENTER), createCell("F", 4, true, AlignmentType.CENTER), createCell("R", 4, true, AlignmentType.CENTER), createCell("COMMENTS", 20, true),
                            createCell("ITEM", 18, true), createCell("G", 4, true, AlignmentType.CENTER), createCell("F", 4, true, AlignmentType.CENTER), createCell("R", 4, true, AlignmentType.CENTER), createCell("COMMENTS", 20, true)
                        ].slice(0, 8) // split columns
                    })
                ];

                // Add 31 Checklist Items in 2-column format
                const half = Math.ceil(checklistItems.length / 2);
                for (let i = 0; i < half; i++) {
                    const item1 = checklistItems[i];
                    const item2 = checklistItems[i + half];

                    const getStatus = (idx) => {
                        if (idx >= checklistItems.length) return { g:'', f:'', r:'', c:'' };
                        const st = document.querySelector(`input[name="item_${idx}_status"]:checked`)?.value || 'Good';
                        const comm = document.getElementById(`item_${idx}_comment`)?.value || '';
                        return {
                            g: st === 'Good' ? '✓' : '',
                            f: st === 'Fair' ? '✓' : '',
                            r: st === 'Replace/Repair' ? '✓' : '',
                            c: st === 'Not Inspected' && !comm ? 'N/A' : comm
                        };
                    };

                    const s1 = getStatus(i);
                    const s2 = getStatus(i + half);

                    const cells = [
                        createCell(item1, 16), createCell(s1.g, 4, false, AlignmentType.CENTER), createCell(s1.f, 4, false, AlignmentType.CENTER), createCell(s1.r, 4, false, AlignmentType.CENTER), createCell(s1.c, 22),
                    ];

                    if (item2) {
                        cells.push(createCell(item2, 16), createCell(s2.g, 4, false, AlignmentType.CENTER), createCell(s2.f, 4, false, AlignmentType.CENTER), createCell(s2.r, 4, false, AlignmentType.CENTER), createCell(s2.c, 22));
                    } else {
                        cells.push(createCell("", 16), createCell("", 4), createCell("", 4), createCell("", 4), createCell("", 22));
                    }

                    rows.push(new TableRow({ children: cells }));
                }

                // Add Appliances & Notes
                rows.push(
                    new TableRow({
                        children: [
                            createCell("Oven Serial / Model / Make:", 25, true),
                            createCell(`${val('oven_serial')} / ${val('oven_model')} / ${val('oven_make')}`, 75)
                        ].map(c => { c.columnSpan = c.width.size === 75 ? 7 : 1; return c; })
                    }),
                    new TableRow({
                        children: [
                            createCell("Fridge Serial / Model / Make:", 25, true),
                            createCell(`${val('fridge_serial')} / ${val('fridge_model')} / ${val('fridge_make')}`, 75)
                        ].map(c => { c.columnSpan = c.width.size === 75 ? 7 : 1; return c; })
                    }),
                    new TableRow({
                        children: [
                            createCell("Notify Officer ASAP?", 25, true),
                            createCell(val('notify_officer'), 75)
                        ].map(c => { c.columnSpan = c.width.size === 75 ? 7 : 1; return c; })
                    }),
                    new TableRow({
                        children: [
                            createCell("Miscellaneous / Comments:", 25, true),
                            createCell(val('miscellaneous'), 75)
                        ].map(c => { c.columnSpan = c.width.size === 75 ? 7 : 1; return c; })
                    })
                );

                const table = new Table({
                    rows: rows,
                    width: { size: 100, type: WidthType.PERCENTAGE }
                });

                const doc = new Document({
                    sections: [{
                        properties: {
                            page: {
                                margin: { top: 500, bottom: 500, left: 500, right: 500 }
                            }
                        },
                        children: [table]
                    }]
                });

                const outBlob = await Packer.toBlob(doc);

                const fileName = `Annual_Inspection_${val('apt_site') || 'Report'}.docx`;
                const file = new File([outBlob], fileName, { 
                    type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' 
                });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Annual Inspection Report',
                        text: 'Please find attached the completed Annual Inspection Word document.',
                        files: [file]
                    });
                } else {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(outBlob);
                    link.download = fileName;
                    link.click();
                }
            } catch (error) {
                console.error("Docx generation failed:", error);
                alert("Error rendering Word document:\n" + error.message);
            } finally {
                btnText.innerText = "Generate & Share Word (.docx)";
            }
        }
    </script>
</body>
</html>
